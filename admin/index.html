<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>신청 관리 | 콘텐츠 이지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    [hidden] { display: none !important; }
    body { background: var(--paper); }
    .admin { width: min(720px, 100% - 32px); margin: 0 auto; padding: 32px 0 64px; }
    .admin h1 { font-size: 1.6rem; font-weight: 800; }
    .login { display: grid; gap: 16px; margin-top: 24px; padding: 24px; background: var(--white); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .logout { font: inherit; font-weight: 700; color: var(--navy); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 8px 0; }
    .count { margin-top: 20px; padding: 20px 24px; background: var(--navy-deep); color: var(--white); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sky); }
    .count strong { display: block; font-size: 2.6rem; line-height: 1.1; font-weight: 800; color: var(--sky); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .filters button, .status button {
      min-height: 44px; padding: 0 16px; font: inherit; font-weight: 700; color: var(--navy);
      background: var(--white); border: var(--line); border-radius: 999px; cursor: pointer;
    }
    .filters button[aria-pressed="true"], .status button[aria-pressed="true"] { background: var(--navy); color: var(--white); box-shadow: 3px 3px 0 var(--sky); }
    .list { display: grid; gap: 14px; margin: 20px 0 0; padding: 0; list-style: none; }
    .card { padding: 18px 20px; background: var(--white); border: var(--line); border-radius: var(--radius); }
    .card.is-late { border-color: #C2410C; box-shadow: 4px 4px 0 #C2410C; }
    .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; }
    .card-name { font-size: 1.15rem; font-weight: 800; }
    .card-kind { padding: 0 10px; font-size: .9rem; font-weight: 700; border: var(--line); border-radius: 999px; background: var(--mint-soft); }
    .card-date { width: 100%; font-size: .9rem; color: rgba(31, 59, 123, .7); }
    .copy { margin-top: 10px; padding: 6px 0; font: inherit; font-size: 1.05rem; font-weight: 700; color: var(--navy); background: none; border: 0; text-decoration: underline; cursor: pointer; text-align: left; }
    .status { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .card-source { margin-top: 6px; font-size: .92rem; color: rgba(31, 59, 123, .8); }
    .channels { margin-top: 20px; padding: 18px 20px; background: var(--white); border: var(--line); border-radius: var(--radius); }
    .channels h2 { font-size: 1.05rem; font-weight: 800; }
    .channels ul { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
    .channels li { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 6px; border-bottom: 1px dashed rgba(31, 59, 123, .25); }
    .channels li strong { font-weight: 800; }
    .late-note { margin-top: 8px; font-weight: 700; color: #C2410C; }
    .msg { margin-top: 16px; font-weight: 700; }
    .empty { margin-top: 20px; padding: 24px; text-align: center; background: var(--white); border: 2px dashed rgba(31, 59, 123, .4); border-radius: var(--radius); }
  </style>
</head>
<body>
  <main class="admin">
    <section id="login-view">
      <h1>신청 관리</h1>
      <form class="login" id="login-form">
        <label class="field">
          <span>관리자 비밀번호</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-apply btn-block" type="submit">들어가기</button>
        <p class="form-msg is-error" id="login-msg" role="alert"></p>
      </form>
    </section>

    <section id="list-view" hidden>
      <div class="top">
        <h1>신청 관리</h1>
        <button class="logout" id="logout" type="button">나가기</button>
      </div>
      <p class="count">새 신청<strong id="new-count">0</strong></p>
      <section class="channels" aria-labelledby="channels-title">
        <h2 id="channels-title">유입 채널별 신청 (전체)</h2>
        <ul id="channels"></ul>
      </section>
      <div class="filters" role="group" aria-label="상태별 보기">
        <button type="button" data-filter="새 문의" aria-pressed="true">새 문의</button>
        <button type="button" data-filter="연락함" aria-pressed="false">연락함</button>
        <button type="button" data-filter="완료" aria-pressed="false">완료</button>
        <button type="button" data-filter="전체" aria-pressed="false">전체</button>
      </div>
      <p class="msg" id="list-msg" role="status" aria-live="polite"></p>
      <ul class="list" id="list"></ul>
    </section>
  </main>

  <script>
    const KEY = 'ce-admin-pass';
    const STATUSES = ['새 문의', '연락함', '완료'];
    const $ = (id) => document.getElementById(id);
    let rows = [];
    let filter = '새 문의';

    const getPass = () => { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } };
    const setPass = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch {} };

    async function call(method, body) {
      const r = await fetch('/api/admin', {
        method,
        headers: { 'x-admin-password': getPass(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { setPass(''); showLogin(data.error || '비밀번호가 맞지 않아요.'); throw new Error('401'); }
      if (!r.ok) throw new Error(data.error || '요청을 처리하지 못했어요.');
      return data;
    }

    function showLogin(message) {
      $('list-view').hidden = true;
      $('login-view').hidden = false;
      $('login-msg').textContent = message || '';
      const input = $('login-form').password;
      input.value = '';
      input.focus();
    }

    const fmt = (iso) => new Date(iso).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
    const isLate = (row) => row.status === '새 문의' && Date.now() - new Date(row.created_at).getTime() > 48 * 3600 * 1000;

    // 유입 채널: UTM source가 있으면 그것, 없으면 들어온 사이트, 둘 다 없으면 직접 방문
    const channelOf = (row) => row.utm_source || row.referrer || '직접 방문';
    const sourceText = (row) => {
      if (row.utm_source) return [row.utm_source, row.utm_medium, row.utm_campaign].filter(Boolean).join(' / ');
      return row.referrer ? `${row.referrer} (링크)` : '직접 방문';
    };

    function renderChannels() {
      const counts = new Map();
      rows.forEach((r) => counts.set(channelOf(r), (counts.get(channelOf(r)) || 0) + 1));
      const list = $('channels');
      list.replaceChildren();
      if (!counts.size) {
        const li = document.createElement('li');
        li.textContent = '아직 들어온 신청이 없어요.';
        list.append(li);
        return;
      }
      [...counts].sort((a, b) => b[1] - a[1]).forEach(([name, n]) => {
        const li = document.createElement('li');
        const label = document.createElement('span');
        label.textContent = name;
        const num = document.createElement('strong');
        num.textContent = `${n}건`;
        li.append(label, num);
        list.append(li);
      });
    }

    function render() {
      $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
      renderChannels();
      document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === filter)));
      const shown = filter === '전체' ? rows : rows.filter((r) => r.status === filter);
      const list = $('list');
      list.replaceChildren();
      if (!shown.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = filter === '전체' ? '아직 들어온 신청이 없어요.' : `'${filter}' 상태인 신청이 없어요.`;
        list.append(li);
        return;
      }
      for (const row of shown) {
        const li = document.createElement('li');
        li.className = 'card' + (isLate(row) ? ' is-late' : '');
        li.innerHTML = `
          <div class="card-head">
            <span class="card-name"></span><span class="card-kind"></span>
            <span class="card-date"></span>
          </div>
          <p class="card-source"></p>
          <button class="copy" type="button" title="눌러서 복사"></button>
          ${isLate(row) ? '<p class="late-note">48시간 넘게 연락을 기다리고 있어요.</p>' : ''}
          <div class="status" role="group" aria-label="처리 상태"></div>`;
        li.querySelector('.card-name').textContent = row.name;
        li.querySelector('.card-kind').textContent = row.kind;
        li.querySelector('.card-date').textContent = fmt(row.created_at);
        li.querySelector('.card-source').textContent = `유입: ${sourceText(row)}`;
        const copy = li.querySelector('.copy');
        copy.textContent = row.contact;
        copy.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(row.contact); $('list-msg').textContent = '연락처를 복사했어요.'; }
          catch { const s = getSelection(); const range = document.createRange(); range.selectNodeContents(copy); s.removeAllRanges(); s.addRange(range); }
        });
        const group = li.querySelector('.status');
        for (const st of STATUSES) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = st;
          b.setAttribute('aria-pressed', String(row.status === st));
          b.addEventListener('click', () => changeStatus(row, st));
          group.append(b);
        }
        list.append(li);
      }
    }

    async function load() {
      $('list-msg').textContent = '불러오는 중이에요.';
      try {
        const data = await call('GET');
        rows = data.rows;
        $('login-view').hidden = true;
        $('list-view').hidden = false;
        $('list-msg').textContent = '';
        render();
      } catch (e) {
        if (e.message !== '401') $('list-msg').textContent = e.message;
      }
    }

    async function changeStatus(row, status) {
      if (row.status === status) return;
      try {
        await call('PATCH', { id: row.id, status });
        $('list-msg').textContent = `${row.name}님 신청을 '${status}'(으)로 바꿨어요.`;
        await load();
      } catch (e) {
        if (e.message !== '401') $('list-msg').textContent = e.message;
      }
    }

    $('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = e.target.password.value;
      if (!v) return showLogin('비밀번호를 적어 주세요.');
      setPass(v);
      load();
    });
    $('logout').addEventListener('click', () => { setPass(''); rows = []; showLogin(''); });
    document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.filter; render(); }));

    if (getPass()) load(); else showLogin('');
  </script>
</body>
</html>
